# ---------------------------------------------------------------------------
# Local run of the framework, browser inside the container.
#
#   export CRM_USERNAME=you@example.com CRM_PASSWORD=secret
#   docker compose up --build --abort-on-container-exit
#
# No Selenium Grid here - the image ships headless Chrome, so one container is a
# complete test environment. Real parallelism across pods is a Kubernetes thing;
# see k8s/05-test-job.yaml, which shards the suite with an indexed Job.
# ---------------------------------------------------------------------------
name: crm-automation

services:

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    image: crm-tests:1.0
    container_name: crm-tests
    environment:
      ENV: qa                     # selects qa.config.properties
      BROWSER: chrome
      HEADLESS: "true"
      REMOTE: "false"             # local ChromeDriver, not a Grid
      CONTAINER: "true"           # adds --no-sandbox --disable-dev-shm-usage
      URL: https://ui.cogmento.com/
      CHROME_BINARY: /usr/bin/google-chrome
      DRIVER_PATH: /usr/local/bin/chromedriver
      SUITE_XML: src/test/resources/testrunners/testng_shard.xml
      SHARD_COUNT: "1"
      SHARD_INDEX: "0"
      USERNAME: ${CRM_USERNAME:-}
      PASSWORD: ${CRM_PASSWORD:-}
      # chrome needs more than the default 64MB of shared memory
      MAVEN_OPTS: "-Xmx1g"
    shm_size: 2gb
    # run as your host uid so the reports written to the bind mounts are owned by you
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./reports:/app/tests/reports                        # extent report output
      - ./screenshot:/app/tests/screenshot                  # failure screenshots
      - ./allure-results:/app/tests/allure-results          # allure raw results
      - ./surefire-reports:/app/tests/target/surefire-reports   # junit xml for jenkins
