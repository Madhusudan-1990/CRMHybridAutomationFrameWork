# The test run. An indexed Job, not a Deployment - a suite must run once to
# completion and exit, and a Deployment would restart finished pods forever.
#
# completionMode: Indexed gives every pod a JOB_COMPLETION_INDEX from 0..completions-1.
# ShardInterceptor reads it and each pod keeps only the methods where
# methodIndex % SHARD_COUNT == its index, so the pods cover disjoint slices of the
# suite instead of all running the same tests against the same application.
apiVersion: batch/v1
kind: Job
metadata:
  name: crm-regression
  namespace: qa-automation
  labels:
    app: crm-tests
    app.kubernetes.io/part-of: crm-automation
spec:
  parallelism: 4              # pods running at once
  completions: 4              # total pods to succeed - keep equal to SHARD_COUNT
  completionMode: Indexed     # injects JOB_COMPLETION_INDEX into each pod
  backoffLimit: 0             # a failed shard must FAIL, not be retried into a green
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: crm-tests
        app.kubernetes.io/part-of: crm-automation
    spec:
      restartPolicy: Never
      # fsGroup lets the non-root image user (uid 10001) write to the PVC
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: tests
          image: ghcr.io/madhusudan-1990/crm-tests:1.0
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: crm-framework-config
            - secretRef:
                name: crm-framework-credentials
          env:
            # supplied by the Job controller because completionMode is Indexed
            - name: SHARD_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['batch.kubernetes.io/job-completion-index']
          command: ["mvn"]
          args:
            - "-B"
            - "test"
            - "-Dsurefire.suiteXmlFiles=$(SUITE_XML)"
          volumeMounts:
            - name: reports
              mountPath: /app/tests/reports
              subPath: reports            # one pvc, a folder each, so they do not collide
            - name: screenshots
              mountPath: /app/tests/screenshot
            - name: allure
              mountPath: /app/tests/allure-results
              subPath: allure-results
          resources:
            requests:
              cpu: "1"
              memory: 2Gi                 # headless chrome needs room
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: reports
          persistentVolumeClaim:
            claimName: crm-test-reports
        - name: allure
          persistentVolumeClaim:
            claimName: crm-test-reports
        # screenshots are throw away, a pod local emptyDir is enough
        - name: screenshots
          emptyDir: {}
