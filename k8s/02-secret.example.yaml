# TEMPLATE ONLY - never commit the real secret.
#
# Create the real one locally, it stays out of git:
#   cp k8s/02-secret.example.yaml k8s/02-secret.yaml
#   vi k8s/02-secret.yaml          <- put the real credentials here
#   kubectl apply -f k8s/02-secret.yaml
#
# k8s/02-secret.yaml is listed in .gitignore. In Jenkins the credentials come
# from the Credentials Store via withCredentials{}, never from a file.
apiVersion: v1
kind: Secret
metadata:
  name: crm-framework-credentials
  namespace: qa-automation
  labels:
    app.kubernetes.io/part-of: crm-automation
type: Opaque
stringData:
  USERNAME: "REPLACE_ME"
  PASSWORD: "REPLACE_ME"
